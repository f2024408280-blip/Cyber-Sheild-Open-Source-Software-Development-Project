<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phishing Detection - CyberShield</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .container {
            background: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            padding: 2rem;
            width: 500px;
        }

        h2 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid #e0e0e0;
        }

        input {
            width: 100%;
            padding: 0.75rem;
            margin: 1rem 0;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            font-size: 0.85rem;
            font-family: 'Inter', sans-serif;
        }

        input:focus {
            outline: none;
            border-color: #1a1a1a;
        }

        button {
            width: 100%;
            padding: 0.75rem;
            background: #1a1a1a;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
        }

        button:hover {
            background: #333;
        }

        .result {
            margin-top: 1.5rem;
            padding: 1rem;
            border-radius: 4px;
            text-align: center;
        }

        .result-danger {
            background: #ffebee;
            border: 1px solid #ef9a9a;
            color: #c62828;
        }

        .result-success {
            background: #e8f5e9;
            border: 1px solid #a5d6a7;
            color: #2e7d32;
        }

        .result-warning {
            background: #fff3e0;
            border: 1px solid #ffcc80;
            color: #e65100;
        }

        .details {
            margin-top: 0.5rem;
            font-size: 0.75rem;
            color: #666;
        }

        .nav-link {
            text-align: center;
            margin-top: 1.5rem;
        }

        .nav-link a {
            color: #666;
            text-decoration: none;
            font-size: 0.8rem;
        }

        .nav-link a:hover {
            color: #1a1a1a;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Phishing Detection</h2>

        <form method="POST">
            <input type="url" name="url" placeholder="Enter URL to analyze (e.g., https://example.com)" required>
            <button type="submit">Analyze URL</button>
        </form>

        {% if result %}
        <div class="result result-{{ result.status }}">
            <strong>{{ result.message }}</strong>
            {% if result.details %}
            <div class="details">
                Suspicious keywords: {{ result.details|join(', ') }}
            </div>
            {% endif %}
        </div>
        {% endif %}

        <div class="nav-link">
            <a href="/dashboard">Return to Dashboard</a>
        </div>
    </div>
</body>
</html>
