<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caesar Cipher - CyberShield</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f5f5f5;
            color: #1a1a1a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .container {
            max-width: 550px;
            width: 100%;
            background: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            padding: 2rem;
        }

        h2 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid #e0e0e0;
        }

        .description {
            font-size: 0.8rem;
            color: #666;
            margin-bottom: 1.5rem;
        }

        textarea {
            width: 100%;
            padding: 0.75rem;
            margin-bottom: 1rem;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            font-size: 0.85rem;
            font-family: 'Inter', monospace;
            resize: vertical;
        }

        textarea:focus {
            outline: none;
            border-color: #1a1a1a;
        }

        .shift-group {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .shift-group label {
            font-size: 0.85rem;
            font-weight: 500;
            color: #333;
        }

        input[type="number"] {
            width: 80px;
            padding: 0.6rem;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            font-size: 0.85rem;
            text-align: center;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #1a1a1a;
        }

        .button-group {
            display: flex;
            gap: 1rem;
            margin: 1rem 0;
        }

        button {
            flex: 1;
            padding: 0.75rem;
            background: #1a1a1a;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
        }

        button:hover {
            background: #333;
        }

        .result-box {
            margin-top: 1.5rem;
            padding: 1rem;
            background: #fafafa;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
        }

        .result-box h4 {
            font-size: 0.7rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .result-box p {
            font-family: monospace;
            font-size: 0.9rem;
            word-break: break-all;
            color: #1a1a1a;
        }

        .example {
            margin-top: 1.5rem;
            padding: 0.75rem;
            background: #fafafa;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            font-size: 0.7rem;
            color: #666;
        }

        .example strong {
            color: #333;
        }

        .nav-link {
            text-align: center;
            margin-top: 1.5rem;
        }

        .nav-link a {
            color: #666;
            text-decoration: none;
            font-size: 0.8rem;
        }

        .nav-link a:hover {
            color: #1a1a1a;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Caesar Cipher</h2>
        <div class="description">
            Encrypt or decrypt messages using the classic Caesar cipher shift technique.
        </div>

        <form method="POST">
            <textarea name="message" rows="4" placeholder="Enter your message here..." required></textarea>
            
            <div class="shift-group">
                <label>Shift (1-25):</label>
                <input type="number" name="shift" min="1" max="25" value="3" required>
            </div>
            
            <div class="button-group">
                <button type="submit" name="action" value="encrypt">Encrypt</button>
                <button type="submit" name="action" value="decrypt">Decrypt</button>
            </div>
        </form>

        {% if result %}
        <div class="result-box">
            <h4>Result</h4>
            <p>{{ result }}</p>
        </div>
        {% endif %}

        <div class="example">
            <strong>Example</strong><br>
            Message: HELLO | Shift: 3 | Encrypt → KHOOR<br>
            Message: KHOOR | Shift: 3 | Decrypt → HELLO
        </div>

        <div class="nav-link">
            <a href="/dashboard">Return to Dashboard</a>
        </div>
    </div>
</body>
</html>
