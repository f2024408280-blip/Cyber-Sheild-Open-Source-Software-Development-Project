<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caesar Cipher - CyberShield</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #fa709a, #fee140);
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            width: 550px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h2 {
            text-align: center;
            color: #fa709a;
            margin-bottom: 10px;
        }
        .description {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
            font-size: 14px;
        }
        textarea {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 14px;
            font-family: monospace;
            resize: vertical;
        }
        .shift-container {
            display: flex;
            align-items: center;
            gap: 15px;
            margin: 15px 0;
        }
        .shift-container label {
            font-weight: bold;
            color: #333;
        }
        input[type="number"] {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            width: 80px;
            text-align: center;
        }
        .buttons {
            display: flex;
            gap: 15px;
            margin: 20px 0;
        }
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: transform 0.2s;
        }
        button:hover {
            transform: scale(1.02);
        }
        .btn-encrypt {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }
        .btn-decrypt {
            background: linear-gradient(135deg, #43e97b, #38f9d7);
            color: white;
        }
        .result {
            margin-top: 25px;
            padding: 20px;
            border-radius: 10px;
            background: #f8f9fa;
            border-left: 4px solid #fa709a;
        }
        .result h4 {
            margin: 0 0 10px 0;
            color: #333;
        }
        .result p {
            margin: 0;
            word-break: break-all;
            font-size: 16px;
            font-family: monospace;
            color: #555;
        }
        .example {
            background: #e9ecef;
            padding: 12px;
            border-radius: 8px;
            margin-top: 20px;
            font-size: 12px;
            color: #666;
        }
        .back {
            text-align: center;
            margin-top: 20px;
        }
        .back a {
            color: #fa709a;
            text-decoration: none;
            font-weight: bold;
        }
        .back a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>🔐 Caesar Cipher Tool</h2>
        <div class="description">
            Encrypt or decrypt messages using Caesar cipher (shift letters)
        </div>
        
        <form method="POST">
            <label><strong>📝 Message:</strong></label>
            <textarea name="message" rows="4" placeholder="Enter your message here..." required></textarea>
            
            <div class="shift-container">
                <label><strong>🔢 Shift (1-25):</strong></label>
                <input type="number" name="shift" min="1" max="25" value="3" required>
            </div>
            
            <div class="buttons">
                <button type="submit" name="action" value="encrypt" class="btn-encrypt">🔒 Encrypt</button>
                <button type="submit" name="action" value="decrypt" class="btn-decrypt">🔓 Decrypt</button>
            </div>
        </form>
        
        {% if result %}
        <div class="result">
            <h4>📌 Result:</h4>
            <p>{{ result }}</p>
        </div>
        {% endif %}
        
        <div class="example">
            <strong>💡 Example:</strong><br>
            Message: "HELLO" | Shift: 3 | Encrypt → "KHOOR"<br>
            Message: "KHOOR" | Shift: 3 | Decrypt → "HELLO"
        </div>
        
        <div class="back">
            <a href="/dashboard">← Back to Dashboard</a>
        </div>
    </div>
</body>
</html>
